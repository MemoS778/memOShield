name: Personal IDS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memOShield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: memOShield/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-soup-3.0 gir1.2-adw-1 xvfb
      - run: go test -count=1 -run TestNativeUnixSocketClient ./internal/personal
      - run: glib-compile-schemas --strict --dry-run desktop/gnome/schemas
      - run: xvfb-run -a gjs -m desktop/app/main.js --help
      - run: xvfb-run -a env MEMOSHIELD_UI_TEST=1 go test -count=1 -run TestNativeUnixSocketClient ./internal/personal
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
