name: Personal IDS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memOShield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: memOShield/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: memOShield/tests/ui/package-lock.json
      - run: node --check internal/personal/ui/app.js
      - run: npm ci
        working-directory: memOShield/tests/ui
      - run: npx playwright install --with-deps chromium
        working-directory: memOShield/tests/ui
      - run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-soup-3.0
      - run: npm test
        working-directory: memOShield/tests/ui
        env:
          GNOME_CLIENT_TEST: '1'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: docker build -t memoshield-test .
